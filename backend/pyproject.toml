[project]
name = "poc-security-assessment"
version = "0.1.0"
description = "AI-Powered Security Assessment & POC Approval Workflow -- Phase 1 vertical slice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 cannot detect bcrypt>=4.1's version marker
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "anthropic>=0.39",
    "google-genai>=0.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
s3 = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
